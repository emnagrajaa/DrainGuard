version: "3.8"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: drainguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: drainguard
      POSTGRES_PASSWORD: drainguard
      POSTGRES_DB: drainguard
    ports:
      - "5432:5432"
    volumes:
      - drainguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drainguard -d drainguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  drainguard_pgdata:
